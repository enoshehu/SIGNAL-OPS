name: Collect and publish

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Restore retained SQLite state
        uses: actions/cache/restore@v6
        with:
          path: runtime
          key: signalops-state-${{ github.run_id }}
          restore-keys: signalops-state-
      - name: Collect one four-city slice
        env:
          DB_API_CLIENT_ID: ${{ secrets.DB_API_CLIENT_ID }}
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
          SIGNALOPS_DATA_DIR: runtime
          SIGNALOPS_SITE_DATA: site/data/summary.json
          SIGNALOPS_RUN_EVIDENCE: run-evidence
        run: python scripts/collect_live.py
      - name: Preserve raw evidence for review
        uses: actions/upload-artifact@v7
        with:
          name: raw-evidence-${{ github.run_id }}
          path: run-evidence
          retention-days: 30
      - name: Save retained SQLite state
        uses: actions/cache/save@v6
        with:
          path: runtime
          key: signalops-state-${{ github.run_id }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
