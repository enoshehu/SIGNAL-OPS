name: Publish dashboard

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "evidence/**"
      - "scripts/**"
      - "src/**"
      - "config/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      collect_live:
        description: Collect fresh DWD and DB data before publishing
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNALOPS_COLLECT_LIVE: ${{ github.event_name == 'schedule' || inputs.collect_live == true }}
      SIGNALOPS_DB_READY: ${{ secrets.DB_API_CLIENT_ID != '' && secrets.DB_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Restore rolling live database
        if: env.SIGNALOPS_COLLECT_LIVE == 'true' && env.SIGNALOPS_DB_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download live-data \
            --pattern signalops-live-data.tar.gz \
            --output signalops-live-data.tar.gz || true
          if test -f signalops-live-data.tar.gz; then
            tar -xzf signalops-live-data.tar.gz
          fi
      - name: Collect due source data and enforce seven-day retention
        if: env.SIGNALOPS_COLLECT_LIVE == 'true' && env.SIGNALOPS_DB_READY == 'true'
        env:
          DB_API_CLIENT_ID: ${{ secrets.DB_API_CLIENT_ID }}
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
          SIGNALOPS_DATA_DIR: runtime
        run: signalops sync --config config/base.toml --env-file /dev/null
      - name: Publish rolling live database
        if: env.SIGNALOPS_COLLECT_LIVE == 'true' && env.SIGNALOPS_DB_READY == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf signalops-live-data.tar.gz runtime
          gh release view live-data >/dev/null 2>&1 || \
            gh release create live-data --title "Rolling seven-day live data" \
              --notes "Automatically maintained SIGNAL//OPS operational data." --prerelease
          gh release upload live-data signalops-live-data.tar.gz --clobber
      - name: Rebuild versioned evidence
        if: env.SIGNALOPS_COLLECT_LIVE != 'true' || env.SIGNALOPS_DB_READY != 'true'
        run: |
          PYTHONPATH=src python scripts/rebuild_evidence.py
          PYTHONPATH=src python scripts/build_dashboard.py \
            --database build/evidence-rebuild/signalops.sqlite
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  report-failure:
    needs: [build, deploy]
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open or update the pipeline incident
        run: |
          title="SIGNAL//OPS scheduled pipeline failure"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          issue_number="$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if test -n "$issue_number"; then
            gh issue comment "$issue_number" --repo "${{ github.repository }}" \
              --body "Another scheduled run failed: ${run_url}"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" \
              --body "The rolling collection or Pages deployment failed. Inspect ${run_url}, follow docs/RUNBOOKS.md, and record the recovery evidence here."
          fi
