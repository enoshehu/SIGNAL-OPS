[dataset]
key = "dwd_live_observations"
name = "DWD current hourly observations"
adapter = "dwd"
stream = "live_observations"
entity_type = "weather_station"
refresh_minutes = 60

[source]
key = "dwd_poi"
name = "DWD Point of Interest observations"
provider = "Deutscher Wetterdienst"
license = "CC BY 4.0"
url = "https://opendata.dwd.de/weather/weather_reports/poi"
delivery = "poi"

[[entities]]
key = "dwd:01078"
name = "Düsseldorf"
city = "duesseldorf"
