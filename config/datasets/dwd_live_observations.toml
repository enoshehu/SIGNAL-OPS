[[quality]]
key = "valid_timestamp"
severity = "high"

[[quality]]
key = "humidity_range"
severity = "medium"

[[quality]]
key = "wind_range"
severity = "high"

[[quality]]
key = "unique_observation"
severity = "high"

[[quality]]
key = "entity_integrity"
severity = "high"

[[quality]]
key = "hourly_continuity"
severity = "medium"

[[quality]]
key = "freshness"
severity = "medium"
max_age_minutes = 180

[[quality]]
key = "schema_drift"
severity = "high"
