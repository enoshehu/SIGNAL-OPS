[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "signalops"
version = "0.5.0"
description = "A configurable real-world public-data operations platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SIGNAL//OPS contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1",
]

[project.scripts]
signalops = "signalops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/signalops"]

[tool.ruff]
line-length = 100
target-version = "py311"
